name: Generate Transfer Application PDF

on:
  workflow_dispatch:
    inputs:
      force_generate:
        description: 'Force generate PDF'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install Pillow  # Additional image handling
    
    - name: Delete existing PDF if exists
      run: |
        if [ -f "Transfer Application.pdf" ]; then
          rm "Transfer Application.pdf"
          echo "Existing PDF deleted"
        fi
    
    - name: Generate PDF
      run: |
        python generate_pdf.py
    
    - name: Upload PDF to Official Tab
      uses: actions/upload-artifact@v4
      with:
        name: Official-Tab
        path: Transfer Application.pdf
        retention-days: 90
        if-no-files-found: error
    
    - name: Commit and push PDF to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "Transfer Application.pdf" || true
        git diff --staged --quiet || git commit -m "Update Transfer Application.pdf [skip ci]"
        git push || echo "No changes to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
