name: Generate and Upload Transfer Application PDF

on:
  workflow_dispatch:
    inputs:
      force_generate:
        description: 'Force generate PDF'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  generate-and-upload-pdf:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate PDF
      run: |
        python generate_pdf.py
    
    - name: Verify PDF exists
      run: |
        if [ -f "Transfer Application.pdf" ]; then
          echo "PDF file size: $(du -h "Transfer Application.pdf" | cut -f1)"
          echo "PDF exists, proceeding with upload"
        else
          echo "PDF file not found!"
          exit 1
        fi
    
    - name: Create Release if not exists
      id: create_release
      run: |
        RELEASE_TAG="application"
        echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
        
        # Check if release exists
        if gh release view ${RELEASE_TAG} 2>/dev/null; then
          echo "Release ${RELEASE_TAG} exists"
          echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
        else
          echo "Creating release ${RELEASE_TAG}"
          gh release create ${RELEASE_TAG} \
            --title "Application PDF Releases" \
            --notes "Automated PDF releases for Transfer Applications" \
            --target ${{ github.sha }}
          echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Delete existing PDF from release
      if: env.RELEASE_EXISTS == 'true'
      run: |
        RELEASE_TAG="application"
        echo "Checking for existing PDF in release ${RELEASE_TAG}"
        
        # Get all asset names that are PDFs
        ASSET_NAMES=$(gh release view ${RELEASE_TAG} --json assets -q '.assets[].name' | grep -i "\\.pdf$" || true)
        
        if [ -n "${ASSET_NAMES}" ]; then
          echo "Found existing PDF assets, deleting..."
          echo "${ASSET_NAMES}" | while read -r ASSET_NAME; do
            if [ -n "${ASSET_NAME}" ]; then
              echo "Deleting asset: ${ASSET_NAME}"
              gh release delete-asset ${RELEASE_TAG} "${ASSET_NAME}" --yes || true
            fi
          done
          echo "Existing PDFs deleted"
        else
          echo "No existing PDF found in release"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload PDF to Release
      run: |
        RELEASE_TAG="application"
        echo "Uploading PDF to release ${RELEASE_TAG}"
        gh release upload ${RELEASE_TAG} "Transfer Application.pdf" --clobber
        echo "PDF uploaded successfully"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify upload
      run: |
        RELEASE_TAG="application"
        echo "Verifying upload..."
        echo "Release assets:"
        gh release view ${RELEASE_TAG} --json assets -q '.assets[] | {name: .name, size: .size}'
        
        # Check if PDF is in release
        if gh release view ${RELEASE_TAG} --json assets -q '.assets[].name' | grep -i "\\.pdf$" | grep -q "pdf"; then
          echo "✅ PDF uploaded successfully to release ${RELEASE_TAG}"
        else
          echo "❌ PDF not found in release"
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
